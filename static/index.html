<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APSU-RAGA</title>
<style>
:root{--ink:#1d2433;--paper:#f3f6fb;--card:#fff;--blue:#1f4e8c;--sand:#e8b04a;--line:#d6deea;--mute:#5d6b82}
@media(prefers-color-scheme:dark){:root{--ink:#e7ecf5;--paper:#0f1522;--card:#182033;--blue:#6aa3ee;--line:#2a3550;--mute:#97a6c0}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:820px;display:flex;flex-direction:column;height:100vh}
header{padding:18px 20px 14px;border-bottom:3px solid var(--sand)}
h1{margin:0;font:700 28px/1.1 Georgia,serif;letter-spacing:.3px;color:var(--blue)}
header p{margin:4px 0 0;color:var(--mute);font-size:14px}
#log{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.m{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;border:1px solid var(--line);background:var(--card)}
.u{align-self:flex-end;background:var(--blue);color:#fff;border-color:var(--blue)}
.m small{display:block;margin-top:8px;color:var(--mute);font-size:12px}
details{margin-top:6px;font-size:12px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 10px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:14px}
.chips button:hover{border-color:var(--blue)}
form{display:flex;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line)}
input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.b{border:0;border-radius:10px;padding:0 16px;background:var(--blue);color:#fff;cursor:pointer;font:inherit;font-weight:600}
.b.mic{background:var(--sand);color:#222}.b.rec{background:#c0392b;color:#fff}
:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
footer{text-align:center;font-size:12px;color:var(--mute);padding:0 0 8px}
</style></head><body><div class="app">
<header><h1>APSU-RAGA</h1><p>Retrieval-Augmented Generative Assistant for A.P.S. University, Rewa — ask about courses, fees, departments, admission. Hindi, Hinglish or English.</p></header>
<div id="log" aria-live="polite"></div>
<div class="chips" id="chips"></div>
<form id="f"><input id="q" placeholder="Poochiye: MSc Physics ki fee kitni hai?" autocomplete="off" aria-label="Your question">
<button type="button" class="b mic" id="mic" title="Speak">🎤 Speak</button><button class="b">Send</button></form>
<footer>Project by Priyanshu Gautam · M.Sc. Computer Science · <span id="st"></span> · <label><input type="checkbox" id="tts" style="flex:none"> read answers aloud</label></footer>
</div><script>
const log=document.getElementById('log'),q=document.getElementById('q'),hist=[];
const ex=["MSc Physics ki fee kitni hai?","Vice-Chancellor kaun hain?","MBA ke liye eligibility kya hai?","BSc Computer Science semester 1 syllabus","Hostel facility hai kya?","What is the NAAC grade of APSU?"];
const chips=document.getElementById('chips');
ex.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>send(t);chips.append(b)});
function add(txt,cls,meta){const d=document.createElement('div');d.className='m '+cls;d.textContent=txt;
 if(meta){if(meta.mode){const s=document.createElement('small');s.textContent='mode: '+meta.mode;d.append(s)}
  if(meta.sources&&meta.sources.length){const e=document.createElement('details');e.innerHTML='<summary>Sources ('+meta.sources.length+')</summary>'+meta.sources.map(x=>`<div>${x.file} — ${x.section} (${x.score})</div>`).join('');d.append(e)}}
 log.append(d);log.scrollTop=log.scrollHeight;return d}
async function send(t){t=t.trim();if(!t)return;q.value='';add(t,'u');const w=add('…','a');
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,history:hist})});
  const d=await r.json();w.remove();add(d.answer,'a',d);hist.push({role:'user',content:t},{role:'assistant',content:d.answer});
  if(document.getElementById('tts').checked){const u=new SpeechSynthesisUtterance(d.answer);u.lang=/[\u0900-\u097F]/.test(d.answer)?'hi-IN':'en-IN';speechSynthesis.cancel();speechSynthesis.speak(u)}
 }catch(e){w.textContent='Server not reachable. Is app.py running?'}}
document.getElementById('f').onsubmit=e=>{e.preventDefault();send(q.value)};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=document.getElementById('mic');
if(!SR){mic.disabled=true;mic.title='Use Chrome or Edge for voice input'}else{const r=new SR();r.lang='hi-IN';
 mic.onclick=()=>{mic.classList.add('rec');mic.textContent='● Listening';r.start()};
 r.onresult=e=>{send(e.results[0][0].transcript)};r.onend=()=>{mic.classList.remove('rec');mic.textContent='🎤 Speak'}}
fetch('/api/status').then(r=>r.json()).then(s=>document.getElementById('st').textContent=s.chunks+' chunks · '+(s.llm?'LLM on':'offline mode'));
add("Namaste! Main APSU Rewa Helpdesk assistant hoon. Courses, fees, departments, admission ya university ke baare mein poochiye.",'a');
</script></body></html>
